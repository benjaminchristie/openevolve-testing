# Same schema as examples/matmul_cpp/project.yaml -- proves the harness (and
# the bundler's language registry) genuinely generalize across languages
# rather than being C++-specific with a Python coat of paint. Only this file
# and src/main.py differ from the C++ example; eval/harness.py is unchanged.
name: matmul_py
language: python
file_suffix: ".py"

bundler:
  src_dir: src
  group: all

build:
  # Python has no separate compile step, but running the syntax/bytecode
  # compiler here still catches a syntactically broken candidate cheaply,
  # before ever executing it. No ccache-equivalent for pure Python -- there's
  # nothing here to cache the way a compiler's object files are cached, so
  # build.cache_env is simply omitted for this project.
  cmd: ["python3", "-m", "py_compile", "src/main.py"]
  timeout_sec: 30

run:
  cmd: ["python3", "src/main.py"]
  timeout_sec: 30

correctness:
  extra_checks:
    - name: type_check
      # Best-effort: only enforced if mypy happens to be installed, so this
      # project.yaml still works out of the box without extra dependencies.
      cmd: ["sh", "-c", "command -v mypy >/dev/null 2>&1 && mypy --ignore-missing-imports src/main.py || true"]
      timeout_sec: 30

workspace:
  mode: ephemeral

scoring:
  primary_metric: duration_ms
  mode: minimize
  scale: 10000.0
