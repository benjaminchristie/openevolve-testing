# Declarative spec consumed by eval/harness.py
name: matmul_cpp
language: cpp
file_suffix: ".cpp"

bundler:
  # Directory the bundler scans for @evolve-tagged blocks, relative to this
  # project's root (the directory this file lives in).
  src_dir: src
  # Which @evolve(<group>) tag this project's OpenEvolve run targets.
  # "all" also pulls in untagged ("universal") blocks alongside every group.
  group: all

build:
  # ccache, used opportunistically
  cmd: ["sh", "-c", "$(command -v ccache) g++ -O2 -std=c++17 src/main.cpp -o matmul_bin"]
  timeout_sec: 60
  cache_env:
    # Relative path
    CCACHE_DIR: .ccache

run:
  cmd: ["./matmul_bin"]
  timeout_sec: 15

correctness:
  # Every command here must exit 0 as part of the stage2 cascade gate (see
  # eval/evaluator.py's evaluate_stage2).
  extra_checks:
    - name: asan_ubsan
      cmd: ["sh", "-c", "$(command -v ccache) g++ -O1 -g -fsanitize=address,undefined -std=c++17 src/main.cpp -o matmul_asan && ./matmul_asan"]
      timeout_sec: 30

workspace:
  # "pool" reuses a fixed number of persistent workspace slots (each keeping
  # its own build/ directory across evaluations) instead of a fresh tempdir
  # per candidate
  mode: pool
  pool_size: 2

scoring:
  # The run/benchmark command must print exactly one JSON line to stdout as
  # its last line:
  #   {"status": "ok"|"error", "metrics": {<name>: <float>, ...}, "message": "..."}
  # A status other than "ok" is scored as a failure regardless of metrics.
  # `primary_metric` drives the scalar score OpenEvolve optimizes; every
  # metric is also passed through under its own name for MAP-Elites feature
  # dimensions.
  primary_metric: duration_ms
  mode: minimize  # "minimize": score = scale / (metric + eps); "maximize": score = metric
  scale: 10000.0
