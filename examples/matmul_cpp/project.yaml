# One file, two readers: OpenEvolve reads llm/database/evaluator/diff_based_evolution/etc,
# eval/harness.py reads bundler/build/run/correctness/workspace/scoring. Each ignores
# what it doesn't recognize, so this is safe to keep merged.
name: matmul_cpp
language: cpp
file_suffix: ".cpp"
log_level: "INFO"

# must be top-level, not nested under "evolution:" -- OpenEvolve silently
# ignores unrecognized keys instead of erroring
diff_based_evolution: true
max_iterations: 10
checkpoint_interval: 10  # keep <= max_iterations or the visualizer never sees a checkpoint (default 100)

llm:
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  primary_model: "gemini-3.1-flash-lite"
  temperature: 0.2
  system_message: |
    You are an expert C++ high-performance computing engineer.
    Optimize the function defined inside the EVOLVE-BLOCK markers to maximize execution speed.
    You may use techniques such as loop tiling/blocking, vectorization/SIMD instructions, cache-friendly memory access patterns, or compiler hints (#pragma GCC optimize).
    Do not change the function signature or break program correctness.

database:
  num_islands: 2  # real field name; "island_count" is silently ignored

evaluator:
  cascade_evaluation: true
  cascade_thresholds: [1.0, 1.0]  # require full correctness before stage3
  parallel_evaluations: 2  # match workspace.pool_size below

bundler:
  # Directory the bundler scans for @evolve-tagged blocks, relative to this
  # project's root (the directory this file lives in).
  src_dir: src
  # Which @evolve(<group>) tag this project's OpenEvolve run targets.
  # "all" also pulls in untagged ("universal") blocks alongside every group.
  group: all

build:
  # ccache, used opportunistically
  cmd: ["sh", "-c", "$(command -v ccache) g++ -O2 -std=c++17 src/main.cpp -o matmul_bin"]
  timeout_sec: 60
  cache_env:
    # Relative path
    CCACHE_DIR: .ccache

run:
  cmd: ["./matmul_bin"]
  timeout_sec: 15

correctness:
  # Every command here must exit 0 as part of the stage2 cascade gate (see
  # eval/evaluator.py's evaluate_stage2).
  extra_checks:
    - name: asan_ubsan
      cmd: ["sh", "-c", "$(command -v ccache) g++ -O1 -g -fsanitize=address,undefined -std=c++17 src/main.cpp -o matmul_asan && ./matmul_asan"]
      timeout_sec: 30

workspace:
  # "pool" reuses a fixed number of persistent workspace slots (each keeping
  # its own build/ directory across evaluations) instead of a fresh tempdir
  # per candidate
  mode: pool
  pool_size: 2

scoring:
  # The run/benchmark command must print exactly one JSON line to stdout as
  # its last line:
  #   {"status": "ok"|"error", "metrics": {<name>: <float>, ...}, "message": "..."}
  # A status other than "ok" is scored as a failure regardless of metrics.
  # `primary_metric` drives the scalar score OpenEvolve optimizes; every
  # metric is also passed through under its own name for MAP-Elites feature
  # dimensions.
  primary_metric: duration_ms
  mode: minimize  # "minimize": score = scale / (metric + eps); "maximize": score = metric
  scale: 10000.0
