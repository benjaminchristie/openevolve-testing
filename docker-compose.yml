services:
  ollama:
    # only started when actually needed -- see the openevolve service's
    # depends_on below, and "Using a local Ollama model" in README.md
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  openevolve:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: openevolve-testing:local
    container_name: openevolve
    depends_on:
      # optional: only actually starts if the "ollama" profile is active
      # (COMPOSE_PROFILES=ollama or --profile ollama), which you only need if
      # project.yaml's llm.api_base points at it
      ollama:
        condition: service_started
        required: false
    # without this, root-owned files land in the bind mount below and you'll
    # need sudo to delete them; run as: UID=$(id -u) GID=$(id -g) docker compose up
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # any directory with a project.yaml, e.g.: PROJECT_PATH=~/research/my_project
      - ${PROJECT_PATH:-./examples/matmul_cpp}:/project
    environment:
      # required unless project.yaml's llm.api_base is Ollama -- checked (and
      # given an Ollama-appropriate placeholder if unset) in
      # docker/entrypoint-evolve.sh, which can actually see that config
      - "OPENAI_API_KEY=${OPENAI_API_KEY:-}"
      - "OPENEVOLVE_PROJECT_DIR=/project"
      # set to anything non-empty to apply the winning result directly instead
      # of writing openevolve_output/best/best.patch for review
      - "AUTO_APPLY=${AUTO_APPLY:-}"
    # runs docker/entrypoint-evolve.sh (the image's default ENTRYPOINT, see docker/Dockerfile)

  visualizer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: openevolve-testing:local
    container_name: openevolve_visualizer
    ports:
      - "8080:8080"
    depends_on:
      - openevolve
    user: "${UID:-1000}:${GID:-1000}"  # see openevolve service above
    volumes:
      - ${PROJECT_PATH:-./examples/matmul_cpp}:/project
    entrypoint: ["/opt/entrypoint-visualizer.sh"]
    restart: unless-stopped

volumes:
  ollama_data:
