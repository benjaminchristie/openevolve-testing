services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  openevolve:
    build: .
    image: openevolve-testing:local
    container_name: openevolve
    depends_on:
      - ollama
    # without this, root-owned files land in the bind mount below and you'll
    # need sudo to delete them; run as: UID=$(id -u) GID=$(id -g) docker compose up
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app2
    environment:
      - "OPENAI_API_KEY=${OPENAI_API_KEY:?ERROR: OPENAI_API_KEY host environment variable is not set!}"
      # which examples/<name>/ to run, e.g.: EXAMPLE=matmul_py docker compose up openevolve
      - "EXAMPLE=${EXAMPLE:-matmul_cpp}"
      - "OPENEVOLVE_PROJECT_DIR=/app2/examples/${EXAMPLE:-matmul_cpp}"
      - "BUNDLER_BIN=/opt/bundler_src/build/bundler"  # pre-built into the image, see Dockerfile
    entrypoint: ["sh", "-c"]
    command:
      - >
        BUNDLE_PATH=$$(python3 /app2/eval/prepare.py "/app2/examples/$$EXAMPLE" | tail -1) &&
        python /app/openevolve-run.py
        "$$BUNDLE_PATH"
        /app2/eval/evaluator.py
        --config "/app2/config/$$EXAMPLE.yaml"
        --output "/app2/openevolve_output/$$EXAMPLE"

  visualizer:
    build: .
    image: openevolve-testing:local
    container_name: openevolve_visualizer
    ports:
      - "8080:8080"
    depends_on:
      - openevolve
    user: "${UID:-1000}:${GID:-1000}"  # see openevolve service above
    volumes:
      - ./:/app2
    environment:
      - "EXAMPLE=${EXAMPLE:-matmul_cpp}"
    entrypoint: ["sh", "-c"]
    command:
      - >
        until [ -d "/app2/openevolve_output/$$EXAMPLE/checkpoints" ]; do
          echo "Waiting for checkpoints directory to be created...";
          sleep 5;
        done;
        echo "Checkpoints directory found! Starting visualizer...";
        python /app/scripts/visualizer.py --path "/app2/openevolve_output/$$EXAMPLE/checkpoints" --host 0.0.0.0
    restart: unless-stopped

volumes:
  ollama_data:
